; Supervisord para la imagen "todo en uno": nginx y la API de Node en el
; mismo contenedor. Los logs de ambos van a la salida estándar para que
; `docker logs juegos-juan` los muestre juntos.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=node /app/server.js
directory=/app
autostart=true
autorestart=true
startretries=10
; Prioridad menor = arranca antes: la API primero, nginx después.
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
