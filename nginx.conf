server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript
        image/svg+xml;

    # Caché larga para assets con hash (CSS, JS, imágenes)
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sin caché para HTML y JSON (se actualizan con cada deploy)
    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Servir ads.txt en la raíz del dominio (requerido por AdSense)
    location = /ads.txt {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # Proxy hacia la API (Node/Express en el contenedor juegos-api)
    #
    # El upstream va en una VARIABLE a propósito. Con el nombre escrito
    # directamente en proxy_pass, nginx lo resuelve al arrancar y, si el
    # contenedor de la API no está levantado, se niega a iniciar con
    # "host not found in upstream" — tumbando la web entera por una API
    # caída. Con una variable la resolución se hace por petición, así que
    # la web sigue sirviéndose y solo fallan las llamadas a /api/ (que el
    # motor de juego ya sabe degradar a sus frases de respaldo).
    location /api/ {
        resolver 127.0.0.11 valid=10s;   # DNS interno de Docker
        set $juegos_api juegos-api:3000;

        # Replica el "strip" del prefijo que hacía la barra final de
        # proxy_pass: /api/frases?x → /frases?x
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://$juegos_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Ruta principal
    location / {
        try_files $uri $uri/ =404;
    }

    # Ocultar versión de nginx
    server_tokens off;
}
