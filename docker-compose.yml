services:

  juegos-juan:
    image: ghcr.io/juandeodin/juegos-juan:latest
    container_name: juegos-juan
    ports:
      - "8080:80"         # Cambia 8080 por el puerto que quieras en CasaOS
    restart: unless-stopped
    depends_on:
      - juegos-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  juegos-api:
    image: ghcr.io/juandeodin/juegos-juan-api:latest
    container_name: juegos-api
    environment:
      # Se leen del fichero .env (ver .env.example). Sin ADMIN_TOKEN el
      # panel /admin queda cerrado (503), nunca abierto.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - DATA_DIR=/data
    volumes:
      # Carpeta del servidor con los JSON de contenido. Vive FUERA de la
      # imagen, así que actualizar los contenedores no toca las frases.
      # Usa una ruta absoluta en DATOS_DIR: una relativa se resuelve desde
      # donde lances docker-compose.
      - ${DATOS_DIR:-./datos-juegos}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/frases?categorias=suave').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Watchtower vivía aquí. Se quitó: en el servidor se quedaba
  # "unhealthy" porque no podía hablar con /var/run/docker.sock, y su
  # imagen `scratch` no tiene shell con la que entrar a depurarlo. Ya no
  # hay despliegue automático; se hace a mano (ver README y el
  # comentario largo en docker-compose.casaos.yml).

# El volumen `juegos-db` de la versión con SQLite ya no se usa. No se borra
# solo: si quieres recuperar la BD antigua sigue ahí hasta que hagas
# `docker volume rm games_hub_juegos-db`.
