name: Build & Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # necesario para publicar en GHCR

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Calcular owner en minúsculas
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Imagen web (nginx + archivos estáticos) ─────────────────
      - name: Construir y publicar imagen web
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/juegos-juan:latest
            ghcr.io/${{ env.OWNER }}/juegos-juan:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── Imagen todo-en-uno (nginx + API en un solo contenedor) ───
      # Es la que se despliega: evita que nginx tenga que localizar a la
      # API por el DNS de Docker, que es donde fallaba en el servidor.
      - name: Construir y publicar imagen todo-en-uno
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.todo-en-uno
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/juegos-juan-todo-en-uno:latest
            ghcr.io/${{ env.OWNER }}/juegos-juan-todo-en-uno:sha-${{ github.sha }}
          cache-from: type=gha,scope=todo
          cache-to: type=gha,mode=max,scope=todo

      # ── Imagen API (Node + Express) ─────────────────────────────
      - name: Construir y publicar imagen API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/juegos-juan-api:latest
            ghcr.io/${{ env.OWNER }}/juegos-juan-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
