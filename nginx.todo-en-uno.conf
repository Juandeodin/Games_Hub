server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript
        image/svg+xml;

    # Caché larga para assets (CSS, JS, imágenes). Los ficheros no llevan
    # hash en el nombre: al cambiar uno compartido hay que subir el ?v=N
    # de sus <script>/<link> o los visitantes conservan la copia vieja.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sin caché para HTML y JSON (se actualizan con cada deploy)
    location ~* \.(html|json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Servir ads.txt en la raíz del dominio (requerido por AdSense)
    location = /ads.txt {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ── Proxy hacia la API ───────────────────────────────────────────
    # La API corre en ESTE MISMO contenedor, así que se llega por
    # 127.0.0.1. No interviene la red de Docker ni su DNS: no hay
    # nombres de contenedor que resolver, ni "host not found in
    # upstream", ni que la API esté en otra red. Tampoco hace falta
    # `resolver`, porque 127.0.0.1 es una IP literal.
    location /api/ {
        # Quita el prefijo: /api/frases?x → /frases?x
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Ruta principal
    location / {
        try_files $uri $uri/ =404;
    }

    # Ocultar versión de nginx
    server_tokens off;
}
